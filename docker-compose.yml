version: "3.8"

services:
  api:
    build: .
    container_name: rag-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ~/.cache/huggingface:/root/.cache/huggingface
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-frontend
    ports:
      - "8501:8501"
    depends_on:
      - api
    command: streamlit run frontend/app_chat.py --server.port 8501 --server.address 0.0.0.0
    restart: unless-stopped

volumes:
  chroma_data:
