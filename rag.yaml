# ==========================================
# RAG 系统配置
# ==========================================

# ---- 模型 ----
llm:
  provider: deepseek          # 目前支持: deepseek, openai
  model: deepseek-v4-flash
  temperature: 0.3
  max_tokens: 2048

embedding:
  provider: huggingface
  model: BAAI/bge-small-zh-v1.5
  device: cpu

# ---- Chroma ----
chroma:
  collection_name: knowledge_base
  persist_directory: data/chroma_db
  md5_store: data/md5.txt

# ---- 文档分块 ----
chunk:
  size: 300
  overlap: 50
  separators:
    - "\n\n"
    - "\n"
    - "。"
    - "！"
    - "？"
    - "，"
    - " "
    - ""

# ---- 重排序 ----
reranker:
  enabled: true
  model: BAAI/bge-reranker-v2-m3
  candidate_k: 15

# ---- 检索 ----
retrieval:
  top_k: 5
  score_threshold: 0.0

# ---- 服务 ----
server:
  host: 0.0.0.0
  port: 8000

# ---- 日志 ----
log:
  level: INFO
  file: logs/rag.log
  max_bytes: 10485760       # 10MB
  backup_count: 5
